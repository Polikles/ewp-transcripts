[project]
name = "ewp-transcripts"
version = "0.18.0"
description = "Local-first transcription for edited podcast and training recordings"
readme = "README.md"
authors = [{ name = "Damian Szczech", email = "szczech.dam+ewptranscript@gmail.com" }]
license = "AGPL-3.0-only"
license-files = ["LICENSE", "LICENSING.md"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyannote-audio==4.0.7",
    "pydantic>=2.13.4",
    "rapidfuzz>=3.14,<4",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchcodec==0.7.0",
    "torchvision==0.23.0",
    "typer>=0.27.0",
    "whisperx==3.8.6",
]

[project.urls]
Repository = "https://github.com/Polikles/ewp-transcripts"
Issues = "https://github.com/Polikles/ewp-transcripts/issues"

[project.scripts]
transcriber = "ewp_transcripts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
triton = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "build>=1.5.0",
    "jsonschema>=4.26.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires local system tools such as FFmpeg and ffprobe",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
