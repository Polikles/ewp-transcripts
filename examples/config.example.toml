# EWP-transcripts — example MVP configuration
config_version = "1.0"

[general]
language = "pl"                 # pl | en | auto
preset = "accurate"
offline = true
interactive = true

[input]
recursive = false
follow_symlinks = false
supported_audio = ["wav", "mp3", "flac", "m4a", "ogg", "opus"]
supported_video = ["mp4", "mkv", "mov", "webm", "avi", "m4v"]

[grouping]
speaker_suffix_separator = "-"
parse_single_file_suffix_only_when_speaker_count_one = true
duration_warning_ms = 100
duration_error_ms = 500
require_equal_sample_rate = true

[channels]
mode = "auto"                   # auto | mono | dual-mono | split-speakers | mixed-stereo
ambiguous_fallback = "dual-mono"
dual_mono_min_correlation = 0.995
dual_mono_max_rms_difference_db = 1.5
dual_mono_max_normalized_difference = 0.1
split_max_correlation = 0.5
split_min_each_exclusive_ratio = 0.05
split_min_total_exclusive_ratio = 0.5
mixed_min_both_active_ratio = 0.8
mixed_min_normalized_difference = 0.1

[models]
# ADR-0007 default for the accurate preset; remains configurable.
asr_model = "large-v2"
asr_repository = "Systran/faster-whisper-large-v2"
asr_revision = "f0fe81560cb8b68660e564f55dd99207059c092e"
asr_snapshot_path = "/home/user/.cache/huggingface/hub/models--Systran--faster-whisper-large-v2/snapshots/f0fe81560cb8b68660e564f55dd99207059c092e"
alignment_model = "jonatasgrosman/wav2vec2-large-xlsr-53-polish"
alignment_revision = "6b1cea36bd8bc5f65ec8081667cd9c0207d51970"
alignment_snapshot_path = "/home/user/.cache/huggingface/hub/models--jonatasgrosman--wav2vec2-large-xlsr-53-polish/snapshots/6b1cea36bd8bc5f65ec8081667cd9c0207d51970"
english_alignment_model = "facebook/wav2vec2-base-960h"
english_alignment_revision = "22aad52d435eb6dbaf354bdad9b0da84ce7d6156"
english_alignment_snapshot_path = "/home/user/.cache/huggingface/hub/models--facebook--wav2vec2-base-960h/snapshots/22aad52d435eb6dbaf354bdad9b0da84ce7d6156"
compute_type = "float16"
batch_size = 4                     # Phase 0 baseline; tune only after stability testing
device = "cuda"
allow_network_downloads_during_transcription = false

[diarization]
model = "pyannote/speaker-diarization-community-1"
model_revision = "3533c8cf8e369892e6b79ff1bf80f7b0286a54ee"
local_model_path = "/home/user/.cache/huggingface/hub/models--pyannote--speaker-diarization-community-1/snapshots/3533c8cf8e369892e6b79ff1bf80f7b0286a54ee"
speaker_count = "auto"         # auto or a positive integer through CLI/config API
preserve_overlap = true
use_exclusive_for_word_assignment = true

[quality]
analyze = true
warn_only = true
detect_clipping = true
detect_low_level = true
detect_channel_imbalance = true
detect_silence_ratio = true

[subtitles]
preset = "youtube"
max_lines = 2
target_chars_per_line = 42
max_chars_per_line = 50
min_duration_ms = 1000
max_duration_ms = 7000
target_chars_per_second = 17
max_chars_per_second = 20
min_gap_ms = 80
max_merge_gap_ms = 1200
min_words_per_cue = 4
speaker_labels = "on-change"   # on-change | always | never
ytt_speaker_palette = ["#FFE8A3", "#FF8FA3", "#A8DADC", "#CDB4DB", "#F4A261", "#B8DE6F"]

# Additional named profiles appear in the GUI. EwP Brand® is supplied by default.
# [subtitles.ytt_color_profiles]
# "My podcast" = ["#F5F7FA", "#00AEEF", "#F2C55B"]

[outputs]
generate_txt = true
generate_srt = false
generate_vtt = false
generate_ytt = false
generate_html = false
generate_segments_json = true
batch_output_directory_name = "output-ewp-transcripts"
encoding = "utf-8"

[revision]
anchor_target_words = 200
long_gap_warning_ms = 2000
generate_audit = false
editor = ""                       # VISUAL, then EDITOR fallback for revise edit

[correction]
provider = ""                       # set to "lm-studio" only when correction is intended
model = ""                          # exact model identifier reported by LM Studio
endpoint = "http://127.0.0.1:1234/v1"
openrouter_endpoint = "https://openrouter.ai/api/v1"
openrouter_api_key_env = "OPENROUTER_API_KEY"
# openrouter_reasoning_max_tokens = 0
allow_remote_endpoint = false          # explicit opt-in for LAN/VPN/Tailscale-like hosts
output_mode = "json-schema"             # json-schema | explicit json-text fallback
prompt_id = "faithful-correction-v11"
target_tokens = 600
max_tokens = 800
context_tokens = 80
timeout_seconds = 120
max_attempts = 3
retry_delay_seconds = 1.0
temperature = 0.0
consent_store = "~/.config/ewp-transcripts/correction-consent.json"

[runtime]
work_root = "/home/user/.cache/ewp-transcripts/work"
keep_temp_on_success = false
keep_temp_on_error = true
continue_batch_after_error = true
max_concurrent_gpu_jobs = 1
lock_timeout_seconds = 0
log_format = "text"            # text | jsonl
log_transcript_text = false
